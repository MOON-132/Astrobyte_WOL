<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WOL Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    
    <!-- React & Babel für In-Browser Kompilierung -->
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.292.0"
      }
    }
    </script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect } from 'react';
        import { createRoot } from 'react-dom/client';
        import { Power, Plus, Settings, Trash2, Edit, Search, CheckCircle2, XCircle, Activity, X, Monitor, Server } from 'lucide-react';

        const themeColors = {
            blue: { bg: 'bg-blue-600', hover: 'hover:bg-blue-700', text: 'text-blue-600', textDark: 'dark:text-blue-400', light: 'bg-blue-100 dark:bg-blue-900/30' },
            emerald: { bg: 'bg-emerald-600', hover: 'hover:bg-emerald-700', text: 'text-emerald-600', textDark: 'dark:text-emerald-400', light: 'bg-emerald-100 dark:bg-emerald-900/30' },
            violet: { bg: 'bg-violet-600', hover: 'hover:bg-violet-700', text: 'text-violet-600', textDark: 'dark:text-violet-400', light: 'bg-violet-100 dark:bg-violet-900/30' },
            rose: { bg: 'bg-rose-600', hover: 'hover:bg-rose-700', text: 'text-rose-600', textDark: 'dark:text-rose-400', light: 'bg-rose-100 dark:bg-rose-900/30' }
        };

        const defaultSettings = { title: 'WOL Dashboard', logoUrl: '', theme: 'dark', accent: 'blue' };

        function App() {
            const [computers, setComputers] = useState([]);
            const [settings, setSettings] = useState(defaultSettings);
            const [search, setSearch] = useState('');
            
            const [showAddModal, setShowAddModal] = useState(false);
            const [showSettingsModal, setShowSettingsModal] = useState(false);
            const [editingComp, setEditingComp] = useState(null);
            const [toast, setToast] = useState(null);

            const [formData, setFormData] = useState({ name: '', mac: '', ip: '' });
            const [tempSettings, setTempSettings] = useState(defaultSettings);

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 4000);
            };

            const fetchData = async () => {
                try {
                    const [setRes, compRes] = await Promise.all([
                        fetch('/api/settings'), fetch('/api/computers')
                    ]);
                    const setJson = await setRes.json();
                    const compJson = await compRes.json();
                    setSettings(setJson);
                    setComputers(compJson);
                    
                    if (setJson.theme === 'dark') document.documentElement.classList.add('dark');
                    else document.documentElement.classList.remove('dark');
                    
                    document.title = setJson.title || 'WOL Dashboard';
                } catch (e) { console.error("Daten konnten nicht geladen werden."); }
            };

            useEffect(() => {
                fetchData();
                const interval = setInterval(async () => {
                    const res = await fetch('/api/computers');
                    setComputers(await res.json());
                }, 10000);
                return () => clearInterval(interval);
            }, []);

            const handleWake = async (comp) => {
                try {
                    const res = await fetch(`/api/wake`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(comp)
                    });
                    const data = await res.json();
                    if (res.ok) showToast(data.message, 'success');
                    else showToast(data.message, 'error');
                } catch (err) {
                    showToast('Verbindungsfehler zum Server', 'error');
                }
            };

            const saveComputersToBackend = async (newComps) => {
                await fetch('/api/computers', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newComps)
                });
                setComputers(newComps);
            };

            const handleSaveComputer = (e) => {
                e.preventDefault();
                let newComps;
                if (editingComp) {
                    newComps = computers.map(c => c.id === editingComp.id ? { ...c, ...formData } : c);
                    showToast('Computer aktualisiert!');
                } else {
                    newComps = [...computers, { ...formData, id: Date.now().toString(), status: 'offline' }];
                    showToast('Computer hinzugefügt!');
                }
                saveComputersToBackend(newComps);
                closeAddModal();
            };

            const handleDelete = (id, name) => {
                if(window.confirm(`${name} wirklich löschen?`)) {
                    saveComputersToBackend(computers.filter(c => c.id !== id));
                    showToast('Computer gelöscht.');
                }
            };

            const openAddModal = (comp = null) => {
                if (comp) {
                    setEditingComp(comp);
                    setFormData({ name: comp.name, mac: comp.mac, ip: comp.ip });
                } else {
                    setEditingComp(null);
                    setFormData({ name: '', mac: '', ip: '' });
                }
                setShowAddModal(true);
            };

            const closeAddModal = () => setShowAddModal(false);

            const saveSettings = async () => {
                await fetch('/api/settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(tempSettings)
                });
                setSettings(tempSettings);
                if (tempSettings.theme === 'dark') document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
                document.title = tempSettings.title || 'WOL Dashboard';
                setShowSettingsModal(false);
                showToast('Einstellungen gespeichert!');
            };

            const filteredComputers = computers.filter(c => 
                c.name.toLowerCase().includes(search.toLowerCase()) || c.ip.includes(search) || c.mac.toLowerCase().includes(search.toLowerCase())
            );

            const activeColor = themeColors[settings.accent] || themeColors.blue;

            return (
                <div className={`min-h-screen transition-colors duration-300 ${settings.theme === 'dark' ? 'bg-gray-900 text-gray-100' : 'bg-gray-50 text-gray-900'}`}>
                    {/* Navbar */}
                    <nav className="sticky top-0 z-30 bg-white/70 dark:bg-gray-800/70 backdrop-blur-lg border-b border-gray-200 dark:border-gray-800">
                        <div className="container mx-auto px-4 py-4 flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                {settings.logoUrl ? (
                                    <img src={settings.logoUrl} alt="Logo" className="h-8 w-auto object-contain" />
                                ) : (
                                    <div className={`p-2 rounded-lg ${activeColor.bg} text-white`}><Activity size={20} /></div>
                                )}
                                <h1 className="text-xl font-bold">{settings.title}</h1>
                            </div>
                            <div className="flex gap-4">
                                <button onClick={() => { setTempSettings(settings); setShowSettingsModal(true); }} className="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700"><Settings size={20} /></button>
                            </div>
                        </div>
                    </nav>

                    <main className="container mx-auto px-4 py-8">
                        <div className="flex flex-col md:flex-row gap-4 justify-between items-center mb-8">
                            <div className="relative w-full md:w-96">
                                <Search className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" size={18} />
                                <input type="text" placeholder="Suchen..." value={search} onChange={(e) => setSearch(e.target.value)} className="w-full pl-10 pr-4 py-2.5 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500" />
                            </div>
                            <button onClick={() => openAddModal()} className={`w-full md:w-auto flex items-center justify-center gap-2 px-6 py-2.5 rounded-xl text-white font-medium ${activeColor.bg} ${activeColor.hover}`}>
                                <Plus size={18} /> Neuer Computer
                            </button>
                        </div>

                        {filteredComputers.length === 0 ? (
                            <div className="text-center py-20"><Monitor size={48} className="mx-auto text-gray-300 dark:text-gray-600 mb-4" /><h3 className="text-lg text-gray-500">Keine Computer</h3></div>
                        ) : (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                                {filteredComputers.map(comp => (
                                    <div key={comp.id} className="group bg-white dark:bg-gray-800 rounded-2xl p-5 border border-gray-100 dark:border-gray-700 flex flex-col shadow-sm hover:shadow-md transition-shadow">
                                        <div className="flex justify-between items-start mb-4">
                                            <div className="flex items-center gap-2">
                                                <span className="relative flex h-3 w-3">
                                                    {comp.status === 'online' && <span className="animate-ping absolute h-full w-full rounded-full bg-emerald-400 opacity-75"></span>}
                                                    <span className={`relative rounded-full h-3 w-3 ${comp.status === 'online' ? 'bg-emerald-500' : 'bg-red-500'}`}></span>
                                                </span>
                                                <span className="text-xs font-semibold uppercase text-gray-500">{comp.status}</span>
                                            </div>
                                            <div className="flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                                <button onClick={() => openAddModal(comp)} className="p-1.5 text-gray-400 hover:text-blue-500"><Edit size={14} /></button>
                                                <button onClick={() => handleDelete(comp.id, comp.name)} className="p-1.5 text-gray-400 hover:text-red-500"><Trash2 size={14} /></button>
                                            </div>
                                        </div>

                                        <div className="mb-6">
                                            <h2 className="text-xl font-bold mb-1 line-clamp-1">{comp.name}</h2>
                                            <div className="flex items-center gap-2 text-sm text-gray-500 mb-1"><Server size={14} />{comp.ip}</div>
                                            <div className="flex items-center gap-2 text-sm text-gray-500"><Activity size={14} />{comp.mac}</div>
                                        </div>

                                        <div className="mt-auto">
                                            <button onClick={() => handleWake(comp)} className={`w-full flex items-center justify-center gap-2 py-2.5 px-4 rounded-xl text-sm font-bold ${activeColor.light} ${activeColor.text} ${activeColor.textDark} hover:bg-opacity-80 transition-all`}>
                                                <Power size={18} /> Wake On LAN
                                            </button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </main>

                    {/* Modals: Computer */}
                    {showAddModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-gray-900/50 backdrop-blur-sm">
                            <div className="bg-white dark:bg-gray-800 rounded-2xl w-full max-w-md overflow-hidden shadow-2xl">
                                <div className="px-6 py-4 border-b dark:border-gray-700 flex justify-between items-center">
                                    <h3 className="font-bold">{editingComp ? 'Bearbeiten' : 'Neuer PC'}</h3>
                                    <button onClick={closeAddModal}><X size={20} /></button>
                                </div>
                                <form onSubmit={handleSaveComputer} className="p-6 space-y-4">
                                    <div><label className="block text-sm mb-1">Name</label><input required value={formData.name} onChange={e=>setFormData({...formData, name: e.target.value})} className="w-full bg-gray-50 dark:bg-gray-900 border dark:border-gray-700 rounded-xl px-4 py-2" /></div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div><label className="block text-sm mb-1">IP</label><input required value={formData.ip} onChange={e=>setFormData({...formData, ip: e.target.value})} className="w-full bg-gray-50 dark:bg-gray-900 border dark:border-gray-700 rounded-xl px-4 py-2 font-mono text-sm" /></div>
                                        <div><label className="block text-sm mb-1">MAC</label><input required value={formData.mac} onChange={e=>setFormData({...formData, mac: e.target.value})} className="w-full bg-gray-50 dark:bg-gray-900 border dark:border-gray-700 rounded-xl px-4 py-2 font-mono text-sm uppercase" /></div>
                                    </div>
                                    <button type="submit" className={`w-full mt-4 px-4 py-2.5 rounded-xl text-white font-medium ${activeColor.bg}`}>Speichern</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Modals: Settings */}
                    {showSettingsModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-gray-900/50 backdrop-blur-sm">
                            <div className="bg-white dark:bg-gray-800 rounded-2xl w-full max-w-md overflow-hidden shadow-2xl">
                                <div className="px-6 py-4 border-b dark:border-gray-700 flex justify-between items-center">
                                    <h3 className="font-bold flex items-center gap-2"><Settings size={18}/> Einstellungen</h3>
                                    <button onClick={() => setShowSettingsModal(false)}><X size={20} /></button>
                                </div>
                                <div className="p-6 space-y-4">
                                    <div><label className="block text-sm mb-1">App-Titel</label><input value={tempSettings.title} onChange={e=>setTempSettings({...tempSettings, title: e.target.value})} className="w-full bg-gray-50 dark:bg-gray-900 border dark:border-gray-700 rounded-xl px-4 py-2" /></div>
                                    <div><label className="block text-sm mb-1">Logo URL</label><input value={tempSettings.logoUrl} onChange={e=>setTempSettings({...tempSettings, logoUrl: e.target.value})} className="w-full bg-gray-50 dark:bg-gray-900 border dark:border-gray-700 rounded-xl px-4 py-2" /></div>
                                    
                                    <div className="pt-2">
                                        <label className="block text-sm mb-2">Theme</label>
                                        <div className="flex gap-2">
                                            <button onClick={()=>setTempSettings({...tempSettings, theme:'light'})} className={`flex-1 py-2 rounded-xl border transition-all ${tempSettings.theme === 'light' ? 'bg-gray-200 dark:bg-gray-600 border-transparent' : 'border-gray-200 dark:border-gray-700'}`}>Hell</button>
                                            <button onClick={()=>setTempSettings({...tempSettings, theme:'dark'})} className={`flex-1 py-2 rounded-xl border transition-all ${tempSettings.theme === 'dark' ? 'bg-gray-200 dark:bg-gray-600 border-transparent' : 'border-gray-200 dark:border-gray-700'}`}>Dunkel</button>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-sm mb-2">Akzentfarbe</label>
                                        <div className="flex gap-4">
                                            {Object.keys(themeColors).map(color => (
                                                <button key={color} onClick={() => setTempSettings({...tempSettings, accent: color})} className={`w-8 h-8 rounded-full transition-transform ${themeColors[color].bg} ${tempSettings.accent === color ? 'scale-110 ring-4 ring-offset-2 ring-gray-400 dark:ring-gray-600' : ''}`}></button>
                                            ))}
                                        </div>
                                    </div>
                                    <button onClick={saveSettings} className="w-full mt-4 px-4 py-2.5 rounded-xl bg-gray-900 dark:bg-gray-100 text-white dark:text-gray-900 font-medium transition-colors hover:opacity-90">Speichern</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Toasts */}
                    {toast && (
                        <div className="fixed bottom-6 right-6 z-50">
                            <div className={`flex items-center gap-2 px-5 py-3 rounded-xl text-white font-medium shadow-xl ${toast.type === 'success' ? 'bg-emerald-600' : 'bg-red-600'}`}>
                                {toast.type === 'success' ? <CheckCircle2 size={18} /> : <XCircle size={18} />} {toast.message}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
